# Nothing ran either gate until round 7. That is precisely how three "fixed"
# claims survived two rounds unwritten, and how a retracted figure stayed
# rendered on a plate for a third: the prose was edited, the SVG was not, and
# no machine ever compared them.
#
# `git diff --exit-code assets/` is the important line. It proves the committed
# SVGs are what plates.py actually generates — so editing prose without
# rebuilding, or hand-editing an asset, fails here instead of shipping.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # §III prints a sha256 of the DEPLOYED wasm and dares the reader to curl it,
  # and §VI makes a claim about a live Space. Push-triggered alone, those dares
  # are only re-checked when THIS repo changes — and a finished page stops
  # changing, so detection latency goes to infinity exactly when nobody is
  # watching any more. §III used to say the gate "fails the moment" the
  # deployment stops matching; that was false with these triggers, and this is
  # the line that makes it true rather than the weaker sentence that would have
  # made it true. (GitHub disables a cron on a repo with no activity for 60
  # days; the freshness note in claims.mjs is the backstop if that happens.)
  schedule:
    - cron: '17 6 * * *'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Plates match their generator, and alts match their plates
        run: |
          python3 build/plates.py
          git diff --exit-code assets/ \
            || { echo "::error::assets/ is stale — run python3 build/plates.py and commit"; exit 1; }

      - name: Measure every plate's geometry across its loop
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node build/gate.mjs

      # gate.mjs measures GEOMETRY — bounding boxes at 0.5 viewBox units, which
      # is 0.7 device pixels at the readme column, i.e. below the threshold of
      # vision. It once passed five plates that were perceptually frozen for up
      # to 4.8 seconds. This rasterises and diffs pixels, which is the only
      # instrument that can answer "did a reader see anything happen".
      #
      # motion.mjs's own header has claimed since round 17 that --gate "makes it
      # fail the build". It did in `npm test` and did not here, which is the
      # same class of untruth this workflow exists to catch.
      - name: Measure every plate in motion, in pixels
        run: node build/motion.mjs --gate

      # The gate above proves the plates are internally consistent. This one
      # leaves the repository: it re-derives every drawn number from the pinned
      # commit it came from, over the network, the same way a reader would.
      # Without it "every number is traceable" is a sentence the page writes
      # about itself.
      - name: Re-derive every number from the repo it came from
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/claims.mjs

      # And the negative test, LAST. Four gates in this repo have shipped unable
      # to fail; two more probes went stale as the plates they anchored on were
      # rewritten; an audit found two further dead checks by hand. mutations.mjs
      # breaks the plates every way it knows, falsifies claims.json and
      # README.md besides, and corrupts the generator's own inputs, and asserts
      # each check notices. The count used to be
      # written out here and said "thirteen" while the file held seventeen —
      # a number in a comment nothing reads is a claim with no gate behind it,
      # which is this repository's whole subject. The run prints the real
      # figure; that one cannot go stale.
      #
      # Each family was added on finding that a whole gate had none. The
      # negative test invoked gate.mjs only, so claims.mjs — the gate that
      # leaves the repository — had never been observed to fail. Then plates.py,
      # which holds the charset coverage and the alt/desc agreement that is this
      # page's entire accessibility contract, turned out to have none either,
      # and writing that family found the agreement skipping in silence whenever
      # README.md did not resolve. Its own header says the negative test must
      # "stop being something you remember to do" — which is what it keeps
      # turning out to be, one gate at a time.
      #
      # It runs last on purpose: a negative test is the only step whose result
      # tells you what the other steps' green MEANT, so it should be the final
      # word, not a thing buried mid-run. The colophon says this workflow
      # "closes with a negative test"; it now does.
      - name: Prove every check can still fail
        run: node build/mutations.mjs
