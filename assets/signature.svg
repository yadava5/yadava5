<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Ayush Yadav — six shipped systems: Glyph, Applied, Cadence, jetpack, LifeQuest and Agentic AutoML, each shown by its signature visual.">
  <title>Ayush Yadav — proof of work</title>

  <defs>
    <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0b0d0e"/>
      <stop offset="0.12" stop-color="#0b0d0e" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#0b0d0e" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0b0d0e"/>
    </linearGradient>
    <clipPath id="stage"><rect x="0" y="52" width="1000" height="176"/></clipPath>
  </defs>

  <style>
    /* ── one 25.2s loop · six 4.2s chapters ─────────────────────────────
       Every animation shares the loop duration and is offset by its
       chapter delay, so each scene plays exactly while it is on stage.
       Only declarative CSS is used — GitHub renders SVG via &lt;img&gt;,
       where scripts never run but CSS animation does.                     */
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
    .serif{ font-family: ui-serif, Georgia, "Times New Roman", serif; font-style: italic; }

    .ch      { opacity: 0; animation: scene 25.2s linear infinite; }
    .c1{animation-delay:-3.0s}    .c2{animation-delay:1.2s}  .c3{animation-delay:5.4s}
    .c4{animation-delay:9.6s} .c5{animation-delay:13.8s} .c6{animation-delay:18.0s}
    @keyframes scene{
      0%{opacity:0} 2%{opacity:1} 15%{opacity:1} 16.667%{opacity:0} 100%{opacity:0}
    }

    /* rise-in used by the caption block of every chapter */
    .rise { animation: rise 25.2s linear infinite; }
    @keyframes rise{
      0%{transform:translateY(8px)} 3%{transform:translateY(0)}
      16.667%{transform:translateY(0)} 100%{transform:translateY(0)}
    }

    /* ── 1 · Glyph — the digits draw themselves, then a glow runs ── */
    /* draw + glow must ride in ONE shorthand — two `animation:` declarations on
       the same element would override each other and the ink would never draw. */
    .ink{ fill:none; stroke:#e7ecef; stroke-width:6; stroke-linecap:round; stroke-linejoin:round;
          stroke-dasharray:1; stroke-dashoffset:1;
          animation: draw 25.2s linear infinite, lit 25.2s linear infinite;
          animation-delay:-3.0s; }
    @keyframes draw{ 0%{stroke-dashoffset:1} 6%{stroke-dashoffset:0} 16.667%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes lit{
      0%,6%{stroke:#e7ecef; filter:none}
      8%{stroke:#eaf6ff; filter:drop-shadow(0 0 7px #38bdf8)}
      12%{stroke:#e7ecef; filter:none}
      16.667%,100%{stroke:#e7ecef; filter:none}
    }
    .g2{animation-delay:-2.72s}.g3{animation-delay:-2.44s}.g4{animation-delay:-2.16s}.g5{animation-delay:-1.88s}
    /* every scene's inner motion carries that scene's absolute offset, so it
       plays while the scene is on stage (ch2 +4.2s, ch3 +8.4s, … ch6 +21s). */

    /* ── 2 · Applied — mail falls through three gates ── */
    .mail{ animation: fall 25.2s linear infinite; }
    @keyframes fall{
      0%{transform:translateY(-46px);opacity:0}
      3%{opacity:1}
      13%{transform:translateY(96px);opacity:1}
      15%{transform:translateY(96px);opacity:0}
      16.667%,100%{opacity:0}
    }
    .m1{animation-delay:1.2s}.m2{animation-delay:1.7s}.m3{animation-delay:2.2s}
    .m4{animation-delay:2.7s}.m5{animation-delay:3.2s}
    .gate{ stroke-dasharray:5 6; animation: gate 25.2s linear infinite; animation-delay:1.2s; }
    @keyframes gate{ 0%{stroke-dashoffset:0} 16.667%{stroke-dashoffset:-66} 100%{stroke-dashoffset:-66} }

    /* ── 3 · Cadence — a sentence resolves into a week ── */
    .type{ animation: type 25.2s steps(24) infinite; animation-delay:5.4s; }
    @keyframes type{ 0%{width:0} 7%{width:236px} 16.667%{width:236px} 100%{width:236px} }
    .land{ animation: land 25.2s linear infinite; animation-delay:5.4s; }
    @keyframes land{
      0%,7%{opacity:0; transform:translate(-120px,-16px) scale(.9)}
      11%{opacity:1; transform:translate(0,0) scale(1)}
      16.667%,100%{opacity:1; transform:translate(0,0) scale(1)}
    }
    .caret{ animation: blink 1s steps(1) infinite; }
    @keyframes blink{ 50%{opacity:0} }

    /* ── 4 · jetpack — parallel lanes compress into one stream ── */
    .blk{ animation: squeeze 25.2s linear infinite; transform-box: fill-box; }
    @keyframes squeeze{
      0%,2%{transform:scaleX(1)} 9%{transform:scaleX(.34)} 16.667%,100%{transform:scaleX(.34)}
    }
    .b1{animation-delay:9.6s}.b2{animation-delay:9.78s}.b3{animation-delay:9.96s}.b4{animation-delay:10.14s}
    .stream{ stroke-dasharray:300; stroke-dashoffset:300; animation: stream 25.2s linear infinite; animation-delay:9.6s; }
    @keyframes stream{ 0%,8%{stroke-dashoffset:300} 14%{stroke-dashoffset:0} 16.667%,100%{stroke-dashoffset:0} }

    /* ── 5 · LifeQuest — routines flip into missions ── */
    .flip{ animation: flip 25.2s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes flip{
      0%,3%{transform:scaleX(1)} 7%{transform:scaleX(0)} 7.01%{transform:scaleX(0)}
      11%{transform:scaleX(1)} 16.667%,100%{transform:scaleX(1)}
    }
    .f1{animation-delay:13.8s}.f2{animation-delay:14.1s}.f3{animation-delay:14.4s}
    .coin{ animation: pop 25.2s linear infinite; transform-box: fill-box; transform-origin:50% 50%; animation-delay:13.8s; }
    @keyframes pop{ 0%,9%{transform:scale(0);opacity:0} 12%{transform:scale(1);opacity:1} 16.667%,100%{transform:scale(1);opacity:1} }

    /* ── 6 · AutoML — the agentic pipeline advances ── */
    .node{ animation: node 25.2s linear infinite; }
    @keyframes node{
      0%{fill:#1b2126; stroke:#2b343b} 6%{fill:#1b2126; stroke:#2b343b}
      8%{fill:#132a33; stroke:#38bdf8} 16.667%,100%{fill:#132a33; stroke:#38bdf8}
    }
    .n1{animation-delay:18.0s}.n2{animation-delay:18.55s}.n3{animation-delay:19.1s}
    .n4{animation-delay:19.65s}.n5{animation-delay:20.2s}
    .wire{ stroke-dasharray:64; stroke-dashoffset:64; animation: wire 25.2s linear infinite; }
    @keyframes wire{ 0%,6%{stroke-dashoffset:64} 11%{stroke-dashoffset:0} 16.667%,100%{stroke-dashoffset:0} }
    .w1{animation-delay:18.0s}.w2{animation-delay:18.55s}.w3{animation-delay:19.1s}.w4{animation-delay:19.65s}

    /* ── the progress rail ── */
    .seg{ animation: seg 25.2s linear infinite; }
    @keyframes seg{ 0%{opacity:.18} 2%{opacity:1} 15%{opacity:1} 16.667%{opacity:.18} 100%{opacity:.18} }

    @media (prefers-reduced-motion: reduce){
      .ch{opacity:1; animation:none}
      .ink,.lit,.mail,.gate,.type,.land,.blk,.stream,.flip,.coin,.node,.wire,.seg,.rise,.caret{animation:none}
      .ink{stroke-dashoffset:0}.stream,.wire{stroke-dashoffset:0}
    }
  </style>

  <!-- canvas -->
  <rect width="1000" height="300" fill="#0b0d0e"/>
  <g opacity="0.5">
    <path d="M0 52.5H1000M0 227.5H1000" stroke="#1b2126" stroke-width="1"/>
  </g>

  <!-- persistent chrome -->
  <text x="40" y="34" class="mono" font-size="13" letter-spacing="4.5" fill="#e7ecef">AYUSH YADAV</text>
  <text x="40" y="52" class="mono" font-size="9.5" letter-spacing="2.6" fill="#5c6a73">SIX SYSTEMS · SHIPPED · MEASURED</text>
  <text x="960" y="34" class="mono" font-size="9.5" letter-spacing="2.6" fill="#5c6a73" text-anchor="end">PROOF OF WORK</text>

  <g clip-path="url(#stage)">

    <!-- ═══ 1 · GLYPH ═══ 97.01 drawn by hand -->
    <g class="ch c1">
      <g transform="translate(70,74) scale(0.62)" stroke="#e7ecef">
        <path class="ink lit"    d="M88 74 C86 40 54 26 40 50 C26 74 44 100 66 96 C80 94 88 82 88 74 C88 118 78 146 44 150" pathLength="1"/>
        <path class="ink lit g2" d="M30 30 L98 30 L56 150" transform="translate(120,0)" pathLength="1"/>
        <circle class="ink lit g3" cx="272" cy="146" r="4" fill="#e7ecef"/>
        <path class="ink lit g4" d="M60 26 C32 26 26 62 26 92 C26 128 38 150 60 150 C82 150 94 120 94 90 C94 58 86 26 60 26 Z" transform="translate(268,0)" pathLength="1"/>
        <path class="ink lit g5" d="M38 48 L64 28 L64 150" transform="translate(388,0)" pathLength="1"/>
      </g>
      <g class="rise c1">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">GLYPH</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">97.01% · a neural net written from scratch in C++</text>
        <text x="380" y="196" class="serif" font-size="15" fill="#38bdf8">one dot product, four instruction sets.</text>
      </g>
    </g>

    <!-- ═══ 2 · APPLIED ═══ mail through the cascade -->
    <g class="ch c2">
      <g transform="translate(70,66)">
        <g stroke="#2b343b" stroke-width="1">
          <path class="gate" d="M0 34H300"/><path class="gate" d="M0 62H300"/><path class="gate" d="M0 90H300"/>
        </g>
        <text x="308" y="38" class="mono" font-size="8.5" letter-spacing="1.6" fill="#5c6a73">RULES · 0.90</text>
        <text x="308" y="66" class="mono" font-size="8.5" letter-spacing="1.6" fill="#5c6a73">e5 · 0.85</text>
        <text x="308" y="94" class="mono" font-size="8.5" letter-spacing="1.6" fill="#5c6a73">SETFIT · 0.70</text>
        <g fill="none" stroke="#22d3ee" stroke-width="1.6">
          <g class="mail m1"><rect x="14" y="0" width="26" height="17" rx="2.5"/><path d="M14 2l13 9 13-9"/></g>
          <g class="mail m2"><rect x="72" y="0" width="26" height="17" rx="2.5"/><path d="M72 2l13 9 13-9"/></g>
          <g class="mail m3" stroke="#f5a524"><rect x="130" y="0" width="26" height="17" rx="2.5"/><path d="M130 2l13 9 13-9"/></g>
          <g class="mail m4"><rect x="188" y="0" width="26" height="17" rx="2.5"/><path d="M188 2l13 9 13-9"/></g>
          <g class="mail m5"><rect x="246" y="0" width="26" height="17" rx="2.5"/><path d="M246 2l13 9 13-9"/></g>
        </g>
      </g>
      <g class="rise c2">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">APPLIED</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">0.979 macro-F1 · the model runs in your browser</text>
        <text x="470" y="196" class="serif" font-size="15" fill="#22d3ee">the verdict was always in the inbox.</text>
      </g>
    </g>

    <!-- ═══ 3 · CADENCE ═══ a sentence becomes a week -->
    <g class="ch c3">
      <g transform="translate(70,72)">
        <rect x="0" y="0" width="252" height="30" rx="6" fill="#11161a" stroke="#2b343b"/>
        <text x="12" y="20" class="mono" font-size="11" fill="#5c6a73">›</text>
        <clipPath id="tclip"><rect class="type" x="24" y="4" width="0" height="22"/></clipPath>
        <text x="24" y="20" class="mono" font-size="11" fill="#e7ecef" clip-path="url(#tclip)">lunch with sam friday 1pm</text>
        <rect class="caret" x="24" y="8" width="1.5" height="14" fill="#34d399" opacity="0.9"/>
        <g transform="translate(0,52)">
          <g stroke="#2b343b" fill="none">
            <rect x="0" y="0" width="48" height="56" rx="4"/><rect x="52" y="0" width="48" height="56" rx="4"/>
            <rect x="104" y="0" width="48" height="56" rx="4"/><rect x="156" y="0" width="48" height="56" rx="4"/>
            <rect x="208" y="0" width="48" height="56" rx="4"/>
          </g>
          <g class="land">
            <rect x="210" y="18" width="44" height="20" rx="3" fill="#0f2a22" stroke="#34d399"/>
            <text x="216" y="32" class="mono" font-size="8" fill="#34d399">1pm · sam</text>
          </g>
          <g class="mono" font-size="7.5" fill="#5c6a73">
            <text x="16" y="-6">MON</text><text x="68" y="-6">TUE</text><text x="120" y="-6">WED</text><text x="172" y="-6">THU</text><text x="226" y="-6">FRI</text>
          </g>
        </g>
      </g>
      <g class="rise c3">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">CADENCE</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">34 handlers, one function · plain English in, calendar out</text>
        <text x="470" y="196" class="serif" font-size="15" fill="#34d399">type it the way you'd say it.</text>
      </g>
    </g>

    <!-- ═══ 4 · JETPACK ═══ lanes compress, one stream leaves -->
    <g class="ch c4">
      <g transform="translate(70,74)">
        <g class="mono" font-size="7.5" fill="#5c6a73">
          <text x="0" y="-6">4 LANES · VIRTUAL THREADS</text>
        </g>
        <g fill="#1b2126" stroke="#f5a524" stroke-width="1.2">
          <rect class="blk b1" x="0" y="4"  width="150" height="16" rx="3"/>
          <rect class="blk b2" x="0" y="28" width="150" height="16" rx="3"/>
          <rect class="blk b3" x="0" y="52" width="150" height="16" rx="3"/>
          <rect class="blk b4" x="0" y="76" width="150" height="16" rx="3"/>
        </g>
        <path class="stream" d="M60 96 C130 96 130 50 300 50" fill="none" stroke="#f5a524" stroke-width="1.6"/>
        <rect x="300" y="40" width="86" height="20" rx="3" fill="#2a2113" stroke="#f5a524"/>
        <text x="309" y="54" class="mono" font-size="8.5" fill="#f5a524">one gzip member</text>
      </g>
      <g class="rise c4">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">JETPACK</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">6.5× throughput · hand-vectorised SIMD on JDK 25</text>
        <text x="470" y="196" class="serif" font-size="15" fill="#f5a524">parallel, and still byte-valid gzip.</text>
      </g>
    </g>

    <!-- ═══ 5 · LIFEQUEST ═══ routines flip into missions -->
    <g class="ch c5">
      <g transform="translate(70,76)">
        <g class="mono" font-size="7.5" fill="#5c6a73"><text x="0" y="-8">ROUTINE → MISSION</text></g>
        <g>
          <g class="flip f1">
            <rect x="0" y="0" width="86" height="52" rx="6" fill="#171226" stroke="#a78bfa"/>
            <text x="12" y="30" class="mono" font-size="9" fill="#c4b5fd">walk 20m</text>
          </g>
          <g class="flip f2">
            <rect x="100" y="0" width="86" height="52" rx="6" fill="#171226" stroke="#a78bfa"/>
            <text x="112" y="30" class="mono" font-size="9" fill="#c4b5fd">apply ×2</text>
          </g>
          <g class="flip f3">
            <rect x="200" y="0" width="86" height="52" rx="6" fill="#171226" stroke="#a78bfa"/>
            <text x="212" y="30" class="mono" font-size="9" fill="#c4b5fd">meet-up</text>
          </g>
        </g>
        <g class="coin">
          <circle cx="322" cy="26" r="15" fill="#2a2113" stroke="#f5a524" stroke-width="1.4"/>
          <text x="322" y="30" class="mono" font-size="10" fill="#f5a524" text-anchor="middle">Q</text>
        </g>
      </g>
      <g class="rise c5">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">LIFEQUEST</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">routines become missions · built for people rebuilding structure</text>
        <text x="470" y="196" class="serif" font-size="15" fill="#a78bfa">progress, made playable.</text>
      </g>
    </g>

    <!-- ═══ 6 · AGENTIC AUTOML ═══ the pipeline advances -->
    <g class="ch c6">
      <g transform="translate(70,92)">
        <g stroke="#2b343b" stroke-width="1.4" fill="none">
          <path class="wire w1" d="M56 16H96"/><path class="wire w2" d="M152 16H192"/>
          <path class="wire w3" d="M248 16H288"/><path class="wire w4" d="M344 16H384"/>
        </g>
        <g stroke-width="1.4">
          <rect class="node n1" x="0"   y="0" width="56" height="32" rx="5"/>
          <rect class="node n2" x="96"  y="0" width="56" height="32" rx="5"/>
          <rect class="node n3" x="192" y="0" width="56" height="32" rx="5"/>
          <rect class="node n4" x="288" y="0" width="56" height="32" rx="5"/>
          <rect class="node n5" x="384" y="0" width="56" height="32" rx="5"/>
        </g>
        <g class="mono" font-size="7.5" fill="#8fa3ae" text-anchor="middle">
          <text x="28" y="20">upload</text><text x="124" y="20">explore</text><text x="220" y="20">prep</text>
          <text x="316" y="20">train</text><text x="412" y="20">deploy</text>
        </g>
      </g>
      <g class="rise c6">
        <text x="70" y="196" class="mono" font-size="15" letter-spacing="3.4" fill="#e7ecef">AGENTIC AUTOML</text>
        <text x="70" y="216" class="mono" font-size="10.5" fill="#7d8b95">LLM-orchestrated pipelines · sandboxed execution, human gates</text>
        <text x="540" y="196" class="serif" font-size="15" fill="#38bdf8">dataset in, deployed model out.</text>
      </g>
    </g>
  </g>

  <!-- edge vignette so scenes enter and leave cleanly -->
  <rect y="52" width="1000" height="176" fill="url(#vig)" pointer-events="none"/>

  <!-- progress rail -->
  <g transform="translate(40,252)">
    <g fill="#e7ecef">
      <rect class="seg c1" x="0"   y="0" width="146" height="2" rx="1"/>
      <rect class="seg c2" x="154" y="0" width="146" height="2" rx="1"/>
      <rect class="seg c3" x="308" y="0" width="146" height="2" rx="1"/>
      <rect class="seg c4" x="462" y="0" width="146" height="2" rx="1"/>
      <rect class="seg c5" x="616" y="0" width="146" height="2" rx="1"/>
      <rect class="seg c6" x="770" y="0" width="146" height="2" rx="1"/>
    </g>
    <text x="0" y="26" class="mono" font-size="9" letter-spacing="2.4" fill="#5c6a73">C++ · SIMD · WASM — TYPESCRIPT — PYTHON — JAVA — POSTGRES · RLS</text>
    <text x="920" y="26" class="mono" font-size="9" letter-spacing="2.4" fill="#5c6a73" text-anchor="end">MIAMI UNIVERSITY ’26</text>
  </g>
</svg>
