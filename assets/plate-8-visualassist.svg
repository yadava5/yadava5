<svg xmlns="http://www.w3.org/2000/svg" viewBox="86 0 708 388" width="708" height="388" role="img" aria-label="VisualAssist: an iPhone app for low-vision users, written in Swift — ARKit LiDAR depth becomes speech and haptics, drawn as the alert policy in front of the phone, to scale. At 0.5 metres the phone interrupts, a continuous haptic drawn as a solid bar on the beam; at 1.0 metres, a triple pulse, drawn as three marks; at 2.0 metres nothing fires at all, and the silence is deliberate — an aid that narrates every wall is an aid you switch off. An obstacle drawn approaching the phone trips each band in turn." data-col="150,730" data-frame="30,64,24">
<title>VisualAssist — three distance bands: stop, caution, silence</title><desc>VisualAssist: an iPhone app for low-vision users, written in Swift — ARKit LiDAR depth becomes speech and haptics, drawn as the alert policy in front of the phone, to scale. At 0.5 metres the phone interrupts, a continuous haptic drawn as a solid bar on the beam; at 1.0 metres, a triple pulse, drawn as three marks; at 2.0 metres nothing fires at all, and the silence is deliberate — an aid that narrates every wall is an aid you switch off. An obstacle drawn approaching the phone trips each band in turn.</desc>
